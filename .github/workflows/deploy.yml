name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

env:
  SC_HOME: /home/simplecloud/serverhost

jobs:
  deploy:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Read versions
        id: versions
        run: |
          echo "lobby=$(yq '.lobby.version' versions.yml)" >> "$GITHUB_OUTPUT"
          echo "lobby_blueprint=$(yq '.lobby.blueprint' versions.yml)" >> "$GITHUB_OUTPUT"
          echo "battle=$(yq '.battle.version' versions.yml)" >> "$GITHUB_OUTPUT"
          echo "battle_blueprint=$(yq '.battle.blueprint' versions.yml)" >> "$GITHUB_OUTPUT"
          echo "proxy=$(yq '.proxy.version' versions.yml)" >> "$GITHUB_OUTPUT"
          echo "proxy_template=$(yq '.proxy.template' versions.yml)" >> "$GITHUB_OUTPUT"

      - name: Create app token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOY_APP_KEY }}
          owner: mythicisland
          repositories: monorepo

      - name: Download releases
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          LOBBY: ${{ steps.versions.outputs.lobby }}
          BATTLE: ${{ steps.versions.outputs.battle }}
          PROXY: ${{ steps.versions.outputs.proxy }}
          PROXY_TEMPLATE: ${{ steps.versions.outputs.proxy_template }}
        run: |
          gh release download "lobby/v$LOBBY" -R mythicisland/monorepo -D dist/lobby
          (cd dist/lobby && sha256sum -c SHA256SUMS)

          # no battle version yet: nothing to deploy for it
          if [ -n "$BATTLE" ] && [ "$BATTLE" != "null" ]; then
            gh release download "battle/v$BATTLE" -R mythicisland/monorepo -D dist/battle
            (cd dist/battle && sha256sum -c SHA256SUMS)
          fi

          # no proxy version yet: the proxy runs without our plugin
          if [ -z "$PROXY" ] || [ "$PROXY" = "null" ]; then
            echo "No proxy version, skipping the proxy plugin"
            exit 0
          fi
          gh release download "proxy/v$PROXY" -R mythicisland/monorepo -D dist/proxy
          (cd dist/proxy && sha256sum -c SHA256SUMS)
          mkdir -p "templates/$PROXY_TEMPLATE/plugins"
          cp dist/proxy/proxy.jar "templates/$PROXY_TEMPLATE/plugins/mythicisland-proxy.jar"

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          echo "REMOTE=$SSH_USER@$SSH_HOST" >> "$GITHUB_ENV"
          echo "RSYNC_RSH=ssh -p ${SSH_PORT:-22}" >> "$GITHUB_ENV"
          echo "SSH_PORT=${SSH_PORT:-22}" >> "$GITHUB_ENV"

      - name: Sync templates
        run: |
          for dir in templates/*/; do
            name="$(basename "$dir")"
            ssh -p "$SSH_PORT" "$REMOTE" "mkdir -p '$SC_HOME/templates/$name'"
            rsync -az --delete --filter='P *.jar' "$dir" "$REMOTE:$SC_HOME/templates/$name/"
          done

      - name: Sync configurators
        run: rsync -az configurators/ "$REMOTE:$SC_HOME/options/configurators/"

      - name: Upload server binaries
        env:
          LOBBY: ${{ steps.versions.outputs.lobby }}
          BATTLE: ${{ steps.versions.outputs.battle }}
        run: |
          upload() {
            local server="$1" version="$2"
            local versioned="$SC_HOME/binaries/$server/$version/$server"
            local current="$SC_HOME/binaries/$server/$server"
            chmod +x "dist/$server/$server"
            ssh -p "$SSH_PORT" "$REMOTE" "mkdir -p '$(dirname "$versioned")'"
            rsync -az --ignore-existing "dist/$server/$server" "$REMOTE:$versioned"
            # a redeploy of the same version finds the link in place, mv refuses to move a file onto itself
            ssh -p "$SSH_PORT" "$REMOTE" "[ '$versioned' -ef '$current' ] || { ln -f '$versioned' '$current.new' && mv -f '$current.new' '$current'; }"
          }
          upload lobby "$LOBBY"
          if [ -d dist/battle ]; then
            upload battle "$BATTLE"
          fi

      - name: Point the lobby blueprint at the binary
        uses: mythicisland/actions/simplecloud/update-blueprint@main
        with:
          network-id: ${{ secrets.SIMPLECLOUD_NETWORK_ID }}
          network-credential: ${{ secrets.SIMPLECLOUD_NETWORK_CREDENTIAL }}
          blueprint-name: ${{ steps.versions.outputs.lobby_blueprint }}
          server-url: ${{ env.SC_HOME }}/binaries/lobby/lobby
          configurator: minestom_velocity
          server-software: minestom
          runtime-config-type: binary

      - name: Point the battle blueprint at the binary
        if: steps.versions.outputs.battle != '' && steps.versions.outputs.battle != 'null'
        uses: mythicisland/actions/simplecloud/update-blueprint@main
        with:
          network-id: ${{ secrets.SIMPLECLOUD_NETWORK_ID }}
          network-credential: ${{ secrets.SIMPLECLOUD_NETWORK_CREDENTIAL }}
          blueprint-name: ${{ steps.versions.outputs.battle_blueprint }}
          server-url: ${{ env.SC_HOME }}/binaries/battle/battle
          configurator: minestom_velocity
          server-software: minestom
          runtime-config-type: binary

      # - uses: mythicisland/actions/simplecloud/rolling-restart@main
      #   with:
      #     network-id: ${{ secrets.SIMPLECLOUD_NETWORK_ID }}
      #     network-credential: ${{ secrets.SIMPLECLOUD_NETWORK_CREDENTIAL }}
      #     server-group-name: lobby
