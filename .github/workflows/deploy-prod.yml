name: deploy to prod

on:
  workflow_dispatch:
    inputs:
      blueprint:
        description: The blueprint that will be deployed to prod
        required: true
        type: choice
        options:
          - all
          - paper/every
          - paper/lobby
          - velocity/proxy
      commit:
        description: The commit that will be deployed to prod
        required: false
        default: ""
        type: string

jobs:
  deploy:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}

      - name: Resolve target
        id: target
        run: |
          targets=()
          case "${{ inputs.blueprint }}" in
            all)
              targets+=("blueprints/paper/every:/home/simplecloud/templates/_every/every_paper")
              targets+=("blueprints/paper/lobby:/home/simplecloud/templates/lobby")
              targets+=("blueprints/velocity/proxy:/home/simplecloud/templates/proxy")
              ;;
            paper/every)
              targets+=("blueprints/paper/every:/home/simplecloud/templates/_every/every_paper")
              ;;
            paper/lobby)
              targets+=("blueprints/paper/lobby:/home/simplecloud/templates/lobby")
              ;;
            velocity/proxy)
              targets+=("blueprints/velocity/proxy:/home/simplecloud/templates/proxy")
              ;;
            *) echo "Unknown blueprint"; exit 1 ;;
          esac

          {
            echo "targets<<EOF"
            for t in "${targets[@]}"; do
              echo "$t"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Setup SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          TARGETS: ${{ steps.target.outputs.targets }}
        run: |
          PORT="${SSH_PORT:-22}"
          echo "$TARGETS" | while IFS=":" read -r src dest; do
            [ -z "$src" ] && continue
            echo "Deploying $src -> $dest..."
            ssh -p "$PORT" "$SSH_USER@$SSH_HOST" "mkdir -p '$dest'"
            rsync -az --delete -e "ssh -p $PORT" "$src/" "$SSH_USER@$SSH_HOST:$dest/"
          done
