server: proxy

storage-method: postgresql

data:
  address: 10.43.0.50:5432
  database: luckperms
  username: luckperms
  password: '{{ secrets.LUCKPERMS_DB_PASSWORD }}'
  pool-settings:
    maximum-pool-size: 10
    minimum-idle: 10
    maximum-lifetime: 1800000 # 30 minutes
    keepalive-time: 0
    connection-timeout: 5000 # 5 seconds
  table-prefix: 'luckperms_'

messaging-service: nats
auto-push-updates: true
push-log-entries: true
broadcast-received-log-entries: false

nats:
  enabled: true
  address: nats.mythicisland.internal:4222
  username: 'mythicisland'
  password: '{{ secrets.QUEUE_NATS_SECRET }}'
