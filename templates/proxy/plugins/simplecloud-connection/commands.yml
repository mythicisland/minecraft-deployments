# The config format version. Do not change this value.
version: 2

commands:
  - name: lobby
    aliases:
      - hub
    permission: ''
    target-connections:
      - name: lobby
        priority: 0
        from: []
    messages:
      already-connected: '<prefix> <warning>You are already in the lobby.'
      no-target-connection-found: '<prefix> <error>There is no lobby available right now.'

  - name: survival
    aliases:
      - danny
    permission: 'mythicisland.connection.survival'
    target-connections:
      - name: survival
        priority: 0
        from: []
    messages:
      already-connected: '<prefix> <warning>You are already in the survival server.'
      no-target-connection-found: '<prefix> <error>There is no survival server available right now.'