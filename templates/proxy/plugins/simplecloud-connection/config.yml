version: '2'

registration:
    enabled: true
    server-name-pattern: '<group>-<numerical_id>'
    persistent-server-name-pattern: '<name>'
    ignore-server-groups-and-persistent-servers: []
    additional-servers: []

address:
  routes:
    - subdomain: 'dev.mythicisland.net'
      target-connection: dev
    - subdomain: 'build.mythicisland.net'
      target-connection: build

connections:
  - name: lobby
    server-name-matcher:
      operation: STARTS_WITH
      value: lobby
      negate: false
    rules: []
  - name: dev
    server-name-matcher:
      operation: STARTS_WITH
      value: dev
      negate: false
    rules: []
  - name: build
    server-name-matcher:
      operation: STARTS_WITH
      value: build
      negate: false
    rules: []

network-join-targets:
    enabled: true
    target-connections:
      - name: lobby
        priority: 0

fallback:
  enabled: true
  target-connections:
    - name: lobby
      priority: 0
      from: []