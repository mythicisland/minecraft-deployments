version: 2

palette:
  brand: '#3B95FF'
  interactive: '#62ADFF'
  highlight: '#CFE4FF'
  muted: '#A1A7B5'
  separator: '#5F5F63'
  info: '#4FA3FF'
  success: '#6AD13C'
  warning: '#FF9029'
  error: '#FF3B30'
  mint: '#1FD98E'
  violet: '#9566FF'
  pink: '#E94BA6'
  gold: '#F2C230'
  cyan: '#22C3DB'
  amber: '#FFA329'

variables:
  prefix: '<brand><b>⚡</b></brand>'

kick:
  no-fallback-servers: '<error>There is no server to send you to.<br><br><muted>Try again in a few seconds.'
  no-target-connection: '<error>There is no server to join right now.<br><br><muted>Try again in a few seconds.'

command:
  command-usage: '<prefix> <info>Use /connection reload to reload the configuration.'
  config-reloading: '<prefix> <info>Reloading the connection configuration.'
  config-reloaded-success: '<prefix> <success>Reloaded the connection configuration!'
  config-reloaded-failed: '<prefix> <error>Couldn''t reload the connection configuration. Check the console.'
