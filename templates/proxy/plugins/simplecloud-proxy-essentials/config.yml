version: '2'

initial-state: vip
initial-layout: vip

show-kick-reason: true

joinstates:
  - name: public
    permission:
      join: ''
      full: 'simplecloud.proxy-essentials.join.full.public'
    forced-motd-layout: null
  - name: maintenance
    permission:
      join: 'simplecloud.proxy-essentials.join.maintenance'
      full: 'simplecloud.proxy-essentials.join.maintenance'
    forced-motd-layout: maintenance
  - name: vip
    permission:
      join: 'island.connection.vip'
      full: 'island.connection.vip'
    forced-motd-layout: vip

external-server-joinstates: {}
  
whitelist:
  enabled: false
  players: []

domains: []

player-count:
  enabled: true
  network: true
  additional-groups: []
  additional-persistent-servers: []
  update-time: 20

tablist:
  - name: global
    layout:
      - header: '<br><brand><smallcaps><env:SIMPLECLOUD_NETWORK_DISPLAY_NAME:SimpleCloud></smallcaps><br>'
        footer: '<br>  <brand>⚡</brand> <highlight>simplecloud.app                <success>●</success> <highlight><online_players> <muted>Online  <br>'
    update-time: 20
