# This is the configuration of our game servers, so the server type is global.
server: global

# We use PostgreSQL to store data.
storage-method: postgresql

# Configure the PostgreSQL data settings.
data:
  # The address of our infrastructure that runs PostgreSQL.
  address: sql.mythicisland.net
  # The name of the LuckPerms database.
  database: luckperms
  # The username for the database.
  username: admin
  # The password for the database.
  password: 'RZfOez5TWZSyMLklKnosleyTnmS3eaK7qbCMcu6E837SLdaCpHsyY8hv5llbLFic'
  # Configure the PostgreSQL pool settings.
  pool-settings:
    # Maximum number of connections in the pool.
    maximum-pool-size: 10
    # Minimum number of idle connections kept open.
    minimum-idle: 10
    # Maximum lifetime of a connection before it is recreated.
    maximum-lifetime: 1800000 # 30 minutes
    # How often a keepalive is sent per connection (0 = disabled).
    keepalive-time: 0
    # How long to wait for a connection before timing out.
    connection-timeout: 5000 # 5 seconds
    properties:
      useUnicode: true
      characterEncoding: utf8
      useSSL: true
      verifyServerCertificate: true
  # Prefix added to all LuckPerms tables.
  table-prefix: 'luckperms_'

# We use NATS as the messaging service to sync changes across servers.
messaging-service: nats
# Automatically push updates to other servers when data changes.
auto-push-updates: true
# Push log entries to other servers over the messaging service.
push-log-entries: true
# On game servers we don't broadcast received log entries to avoid duplicate
# messages, since the proxy already handles this.
broadcast-received-log-entries: true

# Configure the NATS cluster.
nats:
  enabled: true
  address: infra.mythicisland.net:4222
  username: 'admin'
  password: '!OcCaLboW&4JKmF#!33#3ludgVf2NDS@'
# Notify staff in-game when a permission change is made.
log-notify: true

# Maybe set this to true in the future for Bedrock support.
allow-invalid-usernames: false